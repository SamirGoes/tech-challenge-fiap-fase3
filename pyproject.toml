[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medassist"
version = "0.1.0"
description = "Assistente médico com LLM fine-tuned, LangChain e LangGraph (Tech Challenge FIAP fase 3)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3",
    "langgraph>=0.2",
]

[project.optional-dependencies]
train = [
    "torch>=2.2",
    "transformers>=4.44",
    "peft>=0.12",
    "datasets>=2.20",
    "accelerate>=0.33",
    "bitsandbytes>=0.43; platform_system == 'Linux'",
]
hf = [
    "torch>=2.2",
    "transformers>=4.44",
    "peft>=0.12",
    "langchain-huggingface>=0.1",
]
dev = ["pytest>=8"]

[project.scripts]
medassist = "medassist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
